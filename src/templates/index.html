<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Pied Piper Search</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1f232c;
    --border: #2a2f3a;
    --text: #e6e8ee;
    --muted: #8b93a7;
    --accent: #6ea8fe;
    --accent-2: #7ee787;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  .wrap { width: 100%; max-width: 860px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin-bottom: 24px; font-size: 13px; }

  form {
    display: flex;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px;
    transition: border-color .15s;
  }
  form:focus-within { border-color: var(--accent); }

  input[type=text] {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 16px;
    padding: 10px 12px;
    outline: none;
  }
  input[type=number] {
    width: 66px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px;
    font-size: 14px;
    outline: none;
  }
  button {
    background: var(--accent);
    border: none;
    color: #0b0d12;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: filter .15s;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: .5; cursor: wait; }

  .status { color: var(--muted); font-size: 13px; margin: 14px 4px; min-height: 18px; }

  .results { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    animation: fade .18s ease-out;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
    font-size: 12px;
    color: var(--muted);
  }
  .source {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--accent);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .score {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 10px;
    color: var(--accent-2);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .text {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14px;
    color: #d3d7e0;
  }
  .error {
    background: #2a1518;
    border: 1px solid #5a2329;
    color: #ffb3b8;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 14px;
  }
  .kbd {
    font-family: ui-monospace, monospace;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 11px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Pied Piper · Semantic Search</h1>
  <div class="sub">Qwen3-Embedding-4B · FAISS</div>

  <form id="form">
    <input id="q" type="text" placeholder="Что ищем?" autofocus autocomplete="off">
    <input id="k" type="number" min="1" max="50" value="5" title="Top K">
    <button id="btn" type="submit">Найти</button>
  </form>

  <div class="status" id="status"><span class="kbd">Enter</span> — поиск</div>
  <div class="results" id="results"></div>
</div>

<script>
const form = document.getElementById('form');
const qEl = document.getElementById('q');
const kEl = document.getElementById('k');
const btn = document.getElementById('btn');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = qEl.value.trim();
  if (!q) return;

  btn.disabled = true;
  statusEl.textContent = 'Ищу…';
  resultsEl.innerHTML = '';

  try {
    const url = `/api/search?q=${encodeURIComponent(q)}&top_k=${encodeURIComponent(kEl.value)}`;
    const res = await fetch(url);
    const data = await res.json();

    if (!res.ok) throw new Error(data.detail || data.error || `HTTP ${res.status}`);

    const n = data.results.length;
    statusEl.textContent = n ? `Найдено: ${n}` : 'Ничего не найдено';

    for (const r of data.results) {
      const card = document.createElement('div');
      card.className = 'card';

      const src = r.source ?? '—';
      const idx = r.chunk_index ?? '?';

      card.innerHTML = `
        <div class="card-head">
          <div class="source">${escapeHtml(src)} #${escapeHtml(String(idx))}</div>
          <div class="score">${r.score.toFixed(4)}</div>
        </div>
        <div class="text"></div>
      `;
      card.querySelector('.text').textContent = r.text;
      resultsEl.appendChild(card);
    }
  } catch (err) {
    statusEl.textContent = '';
    resultsEl.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
  } finally {
    btn.disabled = false;
  }
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}
</script>
</body>
</html>
